apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator
  namespace: orch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orchestrator-node-metrics-reader
rules:
  # Allows the orchestrator to sample:
  # GET /apis/metrics.k8s.io/v1beta1/nodes
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orchestrator-node-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: orchestrator-node-metrics-reader
subjects:
  - kind: ServiceAccount
    name: orchestrator
    namespace: orch
