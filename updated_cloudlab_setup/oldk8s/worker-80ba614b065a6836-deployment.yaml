apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-80ba614b065a6836
  namespace: default
  labels:
    app: worker-80ba614b065a6836
    role: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-80ba614b065a6836
  template:
    metadata:
      labels:
        app: worker-80ba614b065a6836
        role: worker
    spec:
      nodeSelector:
        topology.kubernetes.io/node-name: beta
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: worker
          image: nobbertins/worker:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
