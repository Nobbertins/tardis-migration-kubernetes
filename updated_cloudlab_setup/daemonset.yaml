apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-metrics-collector
  namespace: default
spec:
  selector:
    matchLabels:
      app: node-metrics-collector
  template:
    metadata:
      labels:
        app: node-metrics-collector
      annotations:
        container.apparmor.security.beta.kubernetes.io/collector: unconfined
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      hostPID: true
      containers:
        - name: collector
          image: nobbertins/collector:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9100
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: SCRAPE_INTERVAL
              value: "1.0"
            - name: RESULTS_FILE
              value: /results/metrics.csv
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: results
              mountPath: /results
          livenessProbe:
            httpGet:
              path: /health
              port: 9100
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: results
          hostPath:
            path: /tmp/node-metrics
            type: DirectoryOrCreate