apiVersion: v1
kind: Pod
metadata:
  name: memory-demo-big
spec:
  containers:
  - name: memory-demo-ctr
    image: polinux/stress
    resources:
      requests:
        memory: "500Mi"
      limits:
        memory: "1000Mi"
    command: ["stress"]
    args: ["--vm", "1", "--vm-bytes", "700M", "--vm-hang", "1"]
